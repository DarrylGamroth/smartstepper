# This is a Kconfig fragment which can be used to enable debug-related options
# in the application. See the README for more details.

# compiler
CONFIG_DEBUG_OPTIMIZATIONS=y
# CONFIG_SPEED_OPTIMIZATIONS=y


# logging
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# Debug/HIL shell workflows can paste long motor profile commands and command
# bursts while the target is also printing logs. Keep these larger than
# production defaults to avoid serial RX overruns during bench validation.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_PRINTF_BUFF_SIZE=256
CONFIG_SHELL_HISTORY_BUFFER=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=8192

CONFIG_CORTEX_M_DEBUG_MONITOR_HOOK=y
CONFIG_SEGGER_DEBUGMON=y

# CONFIG_PWM_LOG_LEVEL_DBG=y
