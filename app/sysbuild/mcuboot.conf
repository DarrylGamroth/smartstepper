# MCUboot image-specific configuration for smartstepper_v2 field-update bring-up.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# The board defconfig enables code/data relocation so the application can place
# ISR stacks in fast memory. MCUboot has no app relocation rules, so leave it off
# for the bootloader image.
CONFIG_CODE_DATA_RELOCATION=n
