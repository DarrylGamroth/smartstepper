id: SMF0102
phase: P01
status: pending
title: Introduce operating mode descriptor table
objective: Define a descriptor table for online operating modes and their required ISR features, guards, and reset policy
touch_files:
  - app/include/motor_operating_mode.h
  - app/src/motor_operating_mode.c
  - app/src/motor_states.c
  - app/src/motor_states_online.c
  - app/CMakeLists.txt
do_not_touch:
  - drivers
constraints:
  - descriptor table must not allocate memory
  - descriptor lookup must be O(1) or bounded small-table lookup
  - no ISR kernel APIs
validation:
  - "podman exec wonderful_goldberg bash -lc 'cd /workspace && west build -p auto -b smartstepper_v2/stm32h743xx /workspace/chopper/app -d /workspace/build/chopper/smartstepper_v2 -S serial-shell -S serial-console -- -DDTC_OVERLAY_FILE=\"boards/smartstepper_v2.overlay;configs/motor_mt6835_2a.overlay\"'"
  - "./tests/run_unit_tests.sh"
done_when:
  - each online mode has one descriptor
  - descriptor includes ISR feature requirements and entry/exit reset class
commit_message: "smf: add operating mode descriptors"
