id: SMF0402
phase: P04
status: pending
title: Normalize mode entry and exit reset policies
objective: Centralize velocity/position/MPR/DOB/current PI reset behavior by reset policy instead of hand-coded per mode
touch_files:
  - app/src/motor_operating_mode.c
  - app/include/motor_operating_mode.h
  - app/src/motor_states_online.c
  - app/src/motor_states.c
do_not_touch:
  - drivers
constraints:
  - resets must remain deterministic and non-blocking
  - do not reset commissioned parameters when only entering/exiting online modes
validation:
  - "podman exec wonderful_goldberg bash -lc 'cd /workspace && west build -p auto -b smartstepper_v2/stm32h743xx /workspace/chopper/app -d /workspace/build/chopper/smartstepper_v2 -S serial-shell -S serial-console -- -DDTC_OVERLAY_FILE=\"boards/smartstepper_v2.overlay;configs/motor_mt6835_2a.overlay\"'"
done_when:
  - duplicated reset blocks are reduced
  - generated and encoder modes start with predictable targets/integrators
commit_message: "smf: centralize online mode reset policy"
