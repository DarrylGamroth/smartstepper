id: SMF0203
phase: P02
status: pending
title: Reset requested mode explicitly in workflows
objective: Make commissioning, detent, and validation commands set and restore requested online mode intentionally
touch_files:
  - app/src/shell_commission_auto.c
  - app/src/shell_commission_detent.c
  - app/src/shell_commission_validate.c
  - app/src/shell_commission_encoder.c
  - app/include/shell_commission_internal.h
do_not_touch:
  - drivers
constraints:
  - workflow must leave the motor in a known safe requested mode on exit
  - restore only when doing so is explicit and safe
validation:
  - "podman exec wonderful_goldberg bash -lc 'cd /workspace && west build -p auto -b smartstepper_v2/stm32h743xx /workspace/chopper/app -d /workspace/build/chopper/smartstepper_v2 -S serial-shell -S serial-console -- -DDTC_OVERLAY_FILE=\"boards/smartstepper_v2.overlay;configs/motor_mt6835_2a.overlay\"'"
done_when:
  - each workflow documents and enforces its requested mode policy
  - abort/failure paths restore safe requested mode
commit_message: "commission: make requested mode ownership explicit"
