id: SMF0302
phase: P03
status: pending
title: Make encoder mapping a first-class setup result
objective: Centralize encoder mapping validity, direction, offset, quality, and freshness into one status object
touch_files:
  - app/include/config.h
  - app/src/shell_commission_encoder.c
  - app/src/motor_encoder_control.c
  - app/include/motor_encoder_control.h
  - app/src/shell_commands_state.c
do_not_touch:
  - drivers
constraints:
  - mapping status must include direction, offset, quality, and source workflow
  - no EEPROM/persistence
validation:
  - "podman exec wonderful_goldberg bash -lc 'cd /workspace && west build -p auto -b smartstepper_v2/stm32h743xx /workspace/chopper/app -d /workspace/build/chopper/smartstepper_v2 -S serial-shell -S serial-console -- -DDTC_OVERLAY_FILE=\"boards/smartstepper_v2.overlay;configs/motor_mt6835_2a.overlay\"'"
done_when:
  - encoder-control status prints mapping result details
  - mode guards use the centralized mapping result
commit_message: "encoder: centralize commutation mapping status"
