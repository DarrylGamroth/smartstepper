# Enable MCUboot when this application is built with `west build --sysbuild`.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Development/HIL signing path. This avoids the RSA/mbedTLS path and uses the
# MCUboot development ECDSA-P256 key. Production must override this key policy.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Keep the first field-update implementation revert-capable without a scratch
# partition. The app must confirm a pending image after health checks.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
