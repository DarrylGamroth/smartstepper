description: AEAT-9955 encoder using a parent low-latency SPI transport

compatible: "brcm,aeat-9955-fast"

include: base.yaml

on-bus: rt-spi

properties:
  reg:
    required: true

  pipeline-delay-samples:
    type: int
    default: 1
    description: Protocol/sample delay to account for in angle-observer configuration.

  spi4-mode:
    type: string
    default: "spi4-16-parity"
    enum:
      - "spi4-16-parity"
      - "spi4-8-crc16"
    description: |
      Runtime protocol expected when the driver starts. Use "spi4-16-parity"
      for factory-default AEAT-9955 devices. Use "spi4-8-crc16" only after
      the encoder has been deliberately configured to SPI4-8 safety mode.
