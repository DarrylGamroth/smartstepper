description: >
  Motor identity, hard limits, and conservative boot fallback model.

  Values in this node must be safe enough for initial current control and
  commissioning after erased settings. They are not necessarily the active
  commissioned model once runtime identification or Settings/ZMS values are
  applied.

compatible: "rubus,motor-parameters"

properties:
  inductance-d-uh:
    type: int
    required: true
    description: Boot/fallback D-axis inductance in microhenries

  inductance-q-uh:
    type: int
    required: true
    description: Boot/fallback Q-axis inductance in microhenries

  resistance-mohms:
    type: int
    required: true
    description: Boot/fallback phase resistance in milliohms

  flux_linkage_uvphz:
    type: int
    required: true
    description: >
      Boot/fallback permanent magnet flux linkage in microvolt-seconds per Hz.
      Commissioning should estimate and stage the runtime value before closed-loop
      tuning is trusted.

  pole-pairs:
    type: int
    required: true
    description: Number of motor pole pairs

  max-current-ma:
    type: int
    required: true
    description: Maximum phase current in milliamps

  inertia-mgcm2:
    type: int
    required: true
    description: >
      Boot/fallback rotor/load inertia in milligram-cm². Commissioning should
      estimate and stage the runtime value before velocity/position tuning is
      trusted.

  max-speed-hz:
    type: int
    required: true
    description: Maximum mechanical speed in Hz
