description: Motor electrical parameters

compatible: "rubus,motor-parameters"

properties:
  inductance-d-uh:
    type: int
    required: true
    description: D-axis inductance in microhenries

  inductance-q-uh:
    type: int
    required: true
    description: Q-axis inductance in microhenries

  resistance-mohms:
    type: int
    required: true
    description: Phase resistance in milliohms

  flux_linkage_uvphz:
    type: int
    required: true
    description: >
      Boot/fallback permanent magnet flux linkage in microvolt-seconds per Hz.
      Commissioning should estimate and stage the runtime value before closed-loop
      tuning is trusted.

  pole-pairs:
    type: int
    required: true
    description: Number of motor pole pairs

  max-current-ma:
    type: int
    required: true
    description: Maximum phase current in milliamps

  inertia-mgcm2:
    type: int
    required: true
    description: >
      Boot/fallback rotor/load inertia in milligram-cm². Commissioning should
      estimate and stage the runtime value before velocity/position tuning is
      trusted.

  max-speed-hz:
    type: int
    required: true
    description: Maximum mechanical speed in Hz
