description: User-configurable motor control parameters

compatible: "rubus,user-parameters"

properties:
  nominal_voltage-mv:
    type: int
    required: true
    description: Nominal DC bus voltage in millivolts

  pwm-frequency-hz:
    type: int
    required: true
    description: PWM switching frequency in Hz

  control-loop-frequency-hz:
    type: int
    required: true
    description: Current control loop frequency in Hz

  current-loop-bandwidth-hz:
    type: int
    required: true
    description: Current controller bandwidth in Hz

  offset-pole-hz:
    type: int
    required: true
    description: Current offset filter pole frequency in Hz

  align-current-ma:
    type: int
    required: true
    description: Rotor alignment current in milliamps

  align-duration-ms:
    type: int
    required: true
    description: Rotor alignment duration in milliseconds

  brake-current-ma:
    type: int
    required: true
    description: Braking current in milliamps

  max-modulation-index-mpu:
    type: int
    required: true
    description: Maximum modulation index in milli-per-unit (570 mpu = 0.57, typical max for SVPWM)

  roverl-est-current-ma:
    type: int
    required: true
    description: RoverL estimation current amplitude in milliamps (10-20% of rated)

  roverl-est-freq-hz:
    type: int
    required: true
    description: RoverL estimation frequency in Hz (default 100 Hz, increase if motor twitches)

  roverl-est-settling-ms:
    type: int
    required: true
    description: RoverL PI controller settling time before measurements in milliseconds (default 50 ms)

  roverl-est-duration-ms:
    type: int
    required: true
    description: RoverL estimation duration in milliseconds (default 5000 ms)

  rs-est-current-ma:
    type: int
    required: true
    description: Rs estimation DC current in milliamps (same as RoverL, 10-20% rated)

  rs-est-rampup-ms:
    type: int
    required: true
    description: Rs estimation ramp-up time in milliseconds (default 1000 ms)

  rs-est-duration-ms:
    type: int
    required: true
    description: Rs estimation measurement duration in milliseconds (default 6000 ms)

  rls-decimation:
    type: int
    default: 16
    description: RLS update rate decimation (power-of-2, default 16 = 1.25 kHz @ 20 kHz loop)

  rls-excitation-current-ma:
    type: int
    default: 100
    description: RLS PRBS excitation amplitude in milliamps applied to d-axis current reference

  prbs-amplitude-millivolts:
    type: int
    default: 100
    description: Legacy RLS PRBS amplitude property (interpreted as milliamps for compatibility)

  rls-lambda-mppu:
    type: int
    default: 9999
    description: RLS forgetting factor in milli-per-unit (9999 mppu = 0.9999)

  rls-convergence-threshold-mpu:
    type: int
    default: 100
    description: RLS convergence threshold for trace(P) in milli-per-unit (100 mpu = 0.1)

  rls-initial-covariance-mpu:
    type: int
    default: 1000
    description: RLS initial covariance diagonal in milli-per-unit (1000 mpu = 1.0)

  rls-initial-lq-millihenries:
    type: int
    default: 5000
    description: Initial Lq estimate in millihenries for cross-coupling (5000 mH = 5 mH)

  rls-stagger-offset:
    type: int
    default: 8
    description: Q-axis RLS stagger offset for load spreading (default 8 = half of decimation)

  thermal-decimation:
    type: int
    default: 2048
    description: Thermal model update rate decimation (default 2048 = ~10Hz @ 20kHz loop)

  thermal-resistance-c-per-w-milli:
    type: int
    default: 10000
    description: Thermal resistance in milli-°C/W (10000 = 10 °C/W typical for small motors)

  thermal-capacitance-j-per-c:
    type: int
    default: 50
    description: Thermal capacitance in J/°C (50 J/°C typical for small motors)

  thermal-ambient-temp-c:
    type: int
    default: 25
    description: Ambient temperature in °C

  rs-temp-coeff-ppm-per-c:
    type: int
    default: 3930
    description: Rs temperature coefficient in ppm/°C (3930 = 0.00393/°C for copper)

  rs-ref-temp-c:
    type: int
    default: 25
    description: Reference temperature for Rs measurement in °C

  rls-min-current-ma:
    type: int
    default: 100
    description: Minimum current magnitude for RLS observability in milliamps

  rls-min-speed-hz:
    type: int
    default: 1
    description: Minimum electrical speed for back-EMF observability in Hz

  rls-max-residual-volts:
    type: int
    default: 5
    description: Maximum RLS residual before disabling (divergence detection) in volts

  rls-max-voltage-volts:
    type: int
    default: 50
    description: Maximum voltage magnitude for validity check in volts

  velocity-max-hz:
    type: int
    default: 50
    description: Maximum mechanical velocity in Hz (revolutions per second)

  velocity-max-accel-hz-per-s:
    type: int
    default: 10
    description: Maximum velocity acceleration/deceleration rate in Hz/s

  velocity-initial-hz:
    type: int
    default: 0
    description: Initial velocity setpoint in Hz (typically 0)

  encoder-direction-sign:
    type: int
    default: 1
    enum:
      - 1
      - 4294967295
    description: >
      Mechanical encoder direction mapping sign used by the control loop.
      Set to 1 for normal direction, or -1 to invert measured mechanical
      angle/speed without writing encoder EEPROM. In devicetree overlays use
      `<(-1)>` for the inverted case.

  commission-standard-min-auto-iq-ma:
    type: int
    default: 250
    description: >
      Minimum Iq limit used by the one-command commissioning workflow before
      flux/mechanical identification. This prevents profile overlays with very
      conservative runtime velocity limits from starving the identification
      stage.

  commission-validate-current-default-iq-ma:
    type: int
    default: 80
    description: >
      Default Iq used by `motor commission validate current` when no current is
      specified. This is a per-motor smoke-test value and should exceed static
      friction/detent torque without approaching the motor current limit.

  commission-auto-post-wait-ms:
    type: int
    default: 2500
    description: Timeout waiting for an auto-commission capture to finalize.

  commission-auto-mech-runs:
    type: int
    default: 3
    description: Number of accepted mechanical identification captures to aggregate.

  commission-auto-mech-max-attempts:
    type: int
    default: 5
    description: Maximum mechanical identification capture attempts.

  commission-auto-mech-cycles-per-capture:
    type: int
    default: 1
    description: Number of dither-pattern cycles per mechanical capture.

  commission-auto-mech-accel-margin-mpu:
    type: int
    default: 1250
    description: >
      Milli-per-unit margin used when deriving mechanical dither period from
      the configured acceleration limit.

  commission-auto-mech-validate-rms-unm:
    type: int
    default: 5000
    description: Mechanical validation residual RMS limit in micro-newton-meters.

  commission-auto-mech-validate-rms-gain-mpu:
    type: int
    default: 5000
    description: >
      Additional mechanical validation residual limit as a milli-per-unit
      multiplier of the aggregate in-fit RMS. The effective validation limit is
      max(commission-auto-mech-validate-rms-unm, gain * aggregate RMS).

  commission-auto-mech-min-confidence-mpu:
    type: int
    default: 500
    description: >
      Minimum aggregate mechanical-fit confidence in milli-per-unit. This is
      used as the fallback acceptance gate if the independent validation
      capture does not contain enough usable motion samples.

  commission-auto-normal-flux-min-mhz:
    type: int
    default: 500
    description: Normal auto-commission flux sweep minimum mechanical speed in mHz.

  commission-auto-normal-flux-max-mhz:
    type: int
    default: 3000
    description: Normal auto-commission flux sweep maximum mechanical speed in mHz.

  commission-auto-normal-mech-max-mhz:
    type: int
    default: 3000
    description: Normal auto-commission mechanical excitation maximum speed in mHz.

  commission-auto-normal-mech-base-mhz:
    type: int
    default: 1500
    description: Normal auto-commission mechanical excitation base speed in mHz.

  commission-auto-normal-mech-dither-mhz:
    type: int
    default: 500
    description: Normal auto-commission mechanical excitation dither speed in mHz.

  commission-auto-slow-flux-min-mhz:
    type: int
    default: 250
    description: Slow auto-commission flux sweep minimum mechanical speed in mHz.

  commission-auto-slow-flux-max-mhz:
    type: int
    default: 750
    description: Slow auto-commission flux sweep maximum mechanical speed in mHz.

  commission-auto-slow-mech-max-mhz:
    type: int
    default: 1000
    description: Slow auto-commission mechanical excitation maximum speed in mHz.

  commission-auto-slow-mech-base-mhz:
    type: int
    default: 500
    description: Slow auto-commission mechanical excitation base speed in mHz.

  commission-auto-slow-mech-dither-mhz:
    type: int
    default: 150
    description: Slow auto-commission mechanical excitation dither speed in mHz.
